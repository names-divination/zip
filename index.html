<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ファイルZIPまとめる君</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 500px;
      margin: 50px auto;
      padding: 20px;
      text-align: center;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    input[type="file"] {
      margin: 20px 0;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
    }
    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>
<body>

  <h2>ファイルZIPまとめてダウンロード</h2>
  <p>圧縮したいファイルを複数選択してください。</p>

  <input type="file" id="fileInput" multiple>
  <br>
  <button id="zipBtn" onclick="createZip()" disabled>ZIPにしてダウンロード</button>

  <script>
    const fileInput = document.getElementById('fileInput');
    const zipBtn = document.getElementById('zipBtn');

    // ファイルが選択されたらボタンを有効化
    fileInput.addEventListener('change', () => {
      zipBtn.disabled = fileInput.files.length === 0;
    });

    async function createZip() {
      const files = fileInput.files;
      if (files.length === 0) return;

      zipBtn.disabled = true;
      zipBtn.textContent = '圧縮中...';

      const zip = new JSZip();

      // 選択された各ファイルをZIPに追加
      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        zip.file(file.name, file);
      }

      // ZIPファイルを生成してダウンロード
      try {
        const content = await zip.generateAsync({ type: 'blob' });
        saveAs(content, 'archive.zip');
      } catch (error) {
        alert('ZIP化に失敗しました。');
        console.error(error);
      } finally {
        zipBtn.disabled = false;
        zipBtn.textContent = 'ZIPにしてダウンロード';
      }
    }
  </script>

</body>
</html>
